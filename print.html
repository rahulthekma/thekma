<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्मार्ट जनसेवा केंद्र | प्रिंट पोर्टल</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .view { display: none; }
        .active { display: block; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- NAVIGATION -->
    <nav class="bg-blue-800 p-4 text-white shadow-lg no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">जनसेवा केंद्र</h1>
            <div class="space-x-2">
                <button id="nav-btn-customer" class="bg-green-600 px-3 py-1 rounded text-sm">ग्राहक</button>
                <button id="nav-btn-admin" class="bg-blue-600 px-3 py-1 rounded text-sm">एडमिन</button>
            </div>
        </div>
    </nav>

    <!-- STATUS MESSAGE BOX -->
    <div id="status-box" class="hidden fixed top-4 right-4 bg-green-500 text-white p-4 rounded-lg shadow-xl z-50"></div>

    <!-- CUSTOMER UPLOAD VIEW -->
    <main id="customer-view" class="view container mx-auto p-4 max-w-md">
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4 text-blue-800">फ़ाइल अपलोड करें</h2>
            <form id="upload-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">आपका नाम</label>
                    <input type="text" id="cust-name" required class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium">फ़ाइल का नाम</label>
                    <input type="text" id="file-name" required class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium">प्रिंट प्रकार</label>
                    <select id="color-type" onchange="window.calculateFee()" class="w-full p-2 border rounded">
                        <option value="bw">सादा (Black & White)</option>
                        <option value="color">रंगीन (Color)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">साइड</label>
                    <select id="side-type" onchange="window.calculateFee()" class="w-full p-2 border rounded">
                        <option value="single">एक तरफा (Single Side)</option>
                        <option value="double">दोनों तरफ (Double Side)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">पृष्ठों की संख्या</label>
                    <input type="number" id="pages-count" value="1" min="1" oninput="window.calculateFee()" class="w-full p-2 border rounded">
                </div>
                <div class="p-3 bg-gray-50 rounded text-center border-2 border-green-200">
                    <p class="text-md">पेमेंट राशि: <span id="total-fee" class="font-bold text-green-700">₹5</span></p>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">सबमिट करें</button>
            </form>
        </div>
    </main>

    <!-- ADMIN DASHBOARD VIEW -->
    <main id="admin-view" class="view active container mx-auto p-4">
        <div class="bg-white p-4 rounded-lg shadow mb-6 overflow-x-auto">
            <h2 class="text-lg font-bold mb-4">लंबित प्रिंट अनुरोध</h2>
            <table class="w-full text-sm text-left">
                <thead><tr class="border-b"><th class="p-2">ग्राहक</th><th class="p-2">विवरण</th><th class="p-2">शुल्क</th><th class="p-2">एक्शन</th></tr></thead>
                <tbody id="order-list"></tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Logic: Show/Hide Views
        const showView = (id) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id + '-view').classList.add('active');
        };

        document.getElementById('nav-btn-customer').addEventListener('click', () => showView('customer'));
        document.getElementById('nav-btn-admin').addEventListener('click', () => showView('admin'));

        // Fee Logic
        window.calculateFee = function() {
            const color = document.getElementById('color-type').value;
            const side = document.getElementById('side-type').value;
            const pages = parseInt(document.getElementById('pages-count').value) || 0;
            let rate = (color === 'color') ? (side === 'double' ? 15 : 10) : 5;
            document.getElementById('total-fee').innerText = '₹' + (rate * pages);
        };

        // Submit Form
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderData = {
                name: document.getElementById('cust-name').value,
                fileName: document.getElementById('file-name').value,
                colorType: document.getElementById('color-type').value,
                sideType: document.getElementById('side-type').value,
                pages: document.getElementById('pages-count').value,
                fee: document.getElementById('total-fee').innerText,
                createdAt: serverTimestamp()
            };
            await addDoc(collection(db, 'orders'), orderData);
            
            const box = document.getElementById('status-box');
            box.innerText = 'ऑर्डर सबमिट हो गया!';
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3000);
            
            e.target.reset();
            window.calculateFee();
        });

        // Live Dashboard
        onSnapshot(collection(db, 'orders'), (snapshot) => {
            const list = document.getElementById('order-list');
            list.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const row = document.createElement('tr');
                row.className = 'border-b';
                row.innerHTML = `<td class="p-2 font-bold">${data.name}</td><td class="p-2">${data.fileName}<br><span class="text-xs text-gray-500">${data.colorType}/${data.sideType}</span></td><td class="p-2">${data.fee}</td><td class="p-2"><button onclick="window.print()" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">Print</button></td>`;
                list.appendChild(row);
            });
        });
    </script>
</body>
</html>
