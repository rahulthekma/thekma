<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Ayush Clinic - Certificate Generator</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;background:#eef1f5;font-family:Arial,sans-serif;color:#17233b}
        .app{min-height:100vh;display:grid;grid-template-columns:370px 1fr}
        .panel{background:#fff;padding:20px;box-shadow:2px 0 12px rgba(0,0,0,.10);overflow:auto}
        h1{margin:0;color:#0c234b;font-size:22px}
        .sub{font-size:12px;color:#64748b;margin:5px 0 18px}
        label{display:block;font-size:13px;font-weight:700;margin:11px 0 5px}
        input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
        
        /* 🎛️ बटन लेआउट */
        .buttons{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
        button{border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer;font-size:14px}
        .success{background:#16a34a;color:#fff} 
        .secondary{background:#e8edf5;color:#102a56}
        
        .hint{font-size:11px;color:#64748b;line-height:1.45;margin-top:12px}
        .stage{padding:24px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
        .sheet{position:relative;width:min(794px,94vw);aspect-ratio:1024/1484;background:#fff;box-shadow:0 5px 25px rgba(0,0,0,.18);overflow:hidden}
        .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
        .text{position:absolute;color:#111;font-family:"Times New Roman",serif;font-size:clamp(15px,1.8vw,20px);line-height:1;white-space:nowrap}
        
        /* 📍 सर्टिफिकेट पर शब्दों की जगह (Positions) */
        .srno-container{left:08.5%;top:38.0%;display:flex;gap:350px;font-weight:550;font-size: 20px;} 
        .gender{left:56.8%;top:42.0%;font-weight:550;font-size: 25px;}
        .mother{left:29.9%;top:46.0%;font-weight:550;font-size: 23px;}
        .father{left:25.5%;top:50.8%;font-weight:550;font-size: 23px}
        .address{left:27.0%;top:55.5%;font-size: 17px}
        .baby{left:28.0%;top:60.0%;font-weight:550;font-size: 23px}
        .date{left:27.0%;top:69.2%;font-weight:550;font-size: 23px}
        .time{left:65.0%;top:69.2%;font-weight:550;font-size: 23px}
        
        @media(max-width:850px){
            .app{grid-template-columns:1fr}
            .panel{box-shadow:none}
            .stage{padding:10px}
        }
        
        /* 🖨️ प्रिंट सेटिंग्स */
        @media print{
            html, body {
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            .panel{display:none !important}
            .app{display:block !important}
            .stage{padding:0 !important; margin:0 !important; overflow: hidden !important;}
            .sheet{
                width:210mm;
                height:304.6mm;
                box-shadow:none;
                margin: 0 auto !important;
                page-break-after: avoid !important;
                page-break-before: avoid !important;
                transform: scale(0.95); /* 95% स्केल */
                transform-origin: top center;
            }
            @page{size:A4 portrait; margin:0 !important;}
        }
    </style>
</head>
<body>
    <div class="app">
        <section class="panel">
            <h1>🩺 Ayush Clinic</h1>
            <div class="sub">Thekma Azamgarh • Certificate Generator</div>
            
            <div class="row">
                <div>
                    <label>Sr. No. (नंबर डालें)</label>
                    <input id="srno" placeholder="e.g. 125">
                </div>
                <div>
                    <label>Issue Date</label>
                    <input id="issueDate" type="date">
                </div>
            </div>

            <label>Baby</label>
            <select id="gender">
                <option value="Girl">Girl</option>
                <option value="Boy">Boy</option>
            </select>
            
            <label>Smt. (Mother) Name</label>
            <input id="mother" placeholder="Mother's name">
            
            <label>W/o Shri (Husband/Father) Name</label>
            <input id="father" placeholder="Husband/Father's name">
            
            <label>Resident of (R/o)</label>
            <input id="address" placeholder="Village, Post, District">
            
            <label>Baby Name (Named as)</label>
            <input id="baby" placeholder="Baby's name">
            
            <div class="row">
                <div>
                    <label>Date (Birth Date)</label>
                    <input id="date" type="date">
                </div>
                <div>
                    <label>Time</label>
                    <input id="time" type="time">
                </div>
            </div>
            
            <div class="buttons">
                <button class="success" onclick="printCertificate()">📥 Save PDF / Print</button>
                <button class="secondary" onclick="newForm()">➕ New</button>
            </div>
            
            <div class="hint">
                <strong>Tips:</strong> <br>
                1. बटन दबाने पर <strong>"Save as PDF"</strong> चुनें या अपना प्रिंटर चुनें।<br>
                2. अतिरिक्त खाली पन्ने की समस्या अब कोड से स्थायी रूप से हटा दी गई है।
            </div>
        </section>
        
        <main class="stage">
            <div class="sheet" id="certificate-sheet">
                <img class="bg" src="Img2.png" alt="Certificate template">
                
                <div class="text srno-container">
                    <span id="oSrno"></span>
                    <span id="oIssueDate"></span>
                </div>

                <div class="text gender" id="oGender">Girl</div>
                <div class="text mother" id="oMother"></div>
                <div class="text father" id="oFather"></div>
                <div class="text address" id="oAddress"></div>
                <div class="text baby" id="oBaby"></div>
                <div class="text date" id="oDate"></div>
                <div class="text time" id="oTime"></div>
            </div>
        </main>
    </div>

    <script>
        const ids = ["srno", "issueDate", "gender", "mother", "father", "address", "baby", "date", "time"];

        function v(id) {
            const el = document.getElementById(id);
            return el ? el.value.trim() : "";
        }

        function getTodayDateString() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function setDefaultDates() {
            const today = getTodayDateString();
            const elIssue = document.getElementById("issueDate");
            const elDate = document.getElementById("date");
            if(elIssue) elIssue.value = today;
            if(elDate) elDate.value = today;
        }

        function formatSrNo(val) {
            if (!val) return "";
            let birthYear = new Date().getFullYear(); 
            const birthDateValue = v("date");
            if (birthDateValue) {
                birthYear = birthDateValue.split("-")[0];
            }
            const cleanNum = val.replace(/[^0-9]/g, ""); 
            const paddedNum = cleanNum.padStart(5, "0"); 
            return "Sr. No : " + birthYear + "/" + paddedNum;
        }

        function dateText(s) {
            if (!s) return "";
            const [y, m, d] = s.split("-");
            return d + "-" + m + "-" + y;
        }

        function formatIssueDate(s) {
            if (!s) return "";
            return "Date : " + dateText(s);
        }

        function formatTime(time) {
            if (!time) return "";
            let [hours, minutes] = time.split(":");
            hours = parseInt(hours, 10);
            const ampm = hours >= 12 ? "PM" : "AM";
            hours = hours % 12 || 12;
            return String(hours).padStart(2, "0") + ":" + minutes + " " + ampm;
        }

        function update() {
            document.getElementById("oSrno").textContent = formatSrNo(v("srno"));
            document.getElementById("oIssueDate").textContent = formatIssueDate(v("issueDate"));
            document.getElementById("oGender").textContent = v("gender");
            document.getElementById("oMother").textContent = v("mother");
            document.getElementById("oFather").textContent = v("father");
            document.getElementById("oAddress").textContent = v("address");
            document.getElementById("oBaby").textContent = v("baby");
            document.getElementById("oDate").textContent = dateText(v("date"));
            document.getElementById("oTime").textContent = formatTime(v("time"));
        }

        ids.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener("input", update);
                el.addEventListener("change", update);
            }
        });

        function newForm() {
            document.getElementById("gender").value = "Girl";
            ["srno", "mother", "father", "address", "baby", "time"].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.value = "";
            });
            setDefaultDates(); 
            update();
        }

        function printCertificate() {
            window.print();
        }

        setDefaultDates();
        update();
    </script>
</body>
</html>
