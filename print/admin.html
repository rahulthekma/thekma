<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC Admin Panel</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow">

<h1 class="text-2xl font-bold text-center text-blue-700 mb-6">
🔐 Admin Login
</h1>

<form id="loginForm" class="space-y-4">

<input
type="email"
id="email"
placeholder="Email"
required
class="w-full border p-2 rounded">

<input
type="password"
id="password"
placeholder="Password"
required
class="w-full border p-2 rounded">

<button
type="submit"
class="w-full bg-blue-600 text-white p-3 rounded">

Login

</button>

</form>

</div>

<div
id="dashboard"
class="hidden max-w-7xl mx-auto mt-10">

<div class="bg-white p-5 rounded-xl shadow">

<div class="flex justify-between items-center mb-4">

<h2 class="text-xl font-bold">
📄 Print Orders
</h2>

<button
id="logoutBtn"
class="bg-red-600 text-white px-4 py-2 rounded">

Logout

</button>

</div>

<div class="overflow-x-auto">

<table class="w-full border">

<thead>

<tr class="bg-gray-200">

<th class="p-2 border">Order ID</th>
<th class="p-2 border">Name</th>
<th class="p-2 border">Mobile</th>
<th class="p-2 border">Fee</th>
<th class="p-2 border">Status</th>
<th class="p-2 border">File</th>
<th class="p-2 border">Action</th>
<th class="p-2 border">Amount</th>
<th class="p-2 border">Payment</th>
</tr>

</thead>

<tbody id="orderTable">

</tbody>

</table>

</div>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
