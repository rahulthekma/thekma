<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC Print Service</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="style.css">

</head>

<body class="bg-gray-100">

<div class="max-w-xl mx-auto mt-10 bg-white shadow-lg rounded-xl p-6">

<h1 class="text-2xl font-bold text-center text-blue-700 mb-6">
📄 Online Print Service
</h1>

<form id="uploadForm" class="space-y-4">

<div>
<label class="font-medium">नाम</label>
<input
type="text"
id="custName"
required
class="w-full border p-2 rounded">
</div>

<div>
<label class="font-medium">मोबाइल नंबर</label>
<input
type="tel"
id="custMobile"
maxlength="10"
required
class="w-full border p-2 rounded">
</div>

<div>
<label class="font-medium">फ़ाइल चुनें</label>
<input
type="file"
id="fileInput"
accept=".pdf,.jpg,.jpeg,.png"
required
class="w-full border p-2 rounded">
</div>

<div>
<label class="font-medium">प्रिंट प्रकार</label>

<select id="colorType"
class="w-full border p-2 rounded">

<option value="bw">
Black & White
</option>

<option value="color">
Color
</option>

</select>
</div>

<div>
<label class="font-medium">साइड</label>

<select id="sideType"
class="w-full border p-2 rounded">

<option value="single">
Single Side
</option>

<option value="double">
Double Side
</option>

</select>
</div>

<div>
<label class="font-medium">
पृष्ठ संख्या
</label>

<input
type="number"
id="pages"
value="1"
min="1"
class="w-full border p-2 rounded">
</div>

<div class="bg-green-100 p-3 rounded text-center">

कुल शुल्क:

<span
id="totalFee"
class="font-bold text-green-700">

₹5

</span>

</div>

<button
type="submit"
id="submitBtn"
class="w-full bg-green-600 text-white p-3 rounded">

सबमिट करें

</button>

</form>

<div
id="successBox"
class="hidden mt-4 bg-green-200 p-4 rounded">

</div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
